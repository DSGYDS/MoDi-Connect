<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f9f5">
  <title>墨堤 · Android UI 初稿</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="prototype-tools" aria-label="原型预览控制">
    <div>
      <strong>墨堤 Android</strong>
      <span>交互初稿 · v1.0 设计书</span>
    </div>
    <div class="tool-actions">
      <button type="button" class="tool-button" id="themeToggle" aria-label="切换深浅主题">深色</button>
      <button type="button" class="tool-button" id="errorTrigger">模拟错误</button>
    </div>
  </aside>

  <main class="device" id="device" aria-label="墨堤安卓应用原型">
    <div class="system-bar" aria-hidden="true">
      <span>9:41</span>
      <span class="system-icons">● ◔ ▰</span>
    </div>

    <div class="app-surface">
      <section class="screen screen-audio is-active" data-screen="audio" aria-labelledby="audioTitle">
        <h1 id="audioTitle" class="sr-only">音频</h1>
        <div class="audio-stage" id="stageArea" data-stream-state="IDLE" aria-hidden="true">
          <svg viewBox="0 0 400 420" preserveAspectRatio="xMidYMid slice" role="presentation">
            <defs>
              <linearGradient id="paperWash" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="var(--surface)"/>
                <stop offset="1" stop-color="var(--surface-variant)"/>
              </linearGradient>
              <filter id="inkSoft"><feGaussianBlur stdDeviation="0.7"/></filter>
            </defs>
            <g data-stage-layer="paper">
              <rect width="400" height="420" fill="url(#paperWash)"/>
              <path class="paper-fiber" d="M-10 76 C92 61 176 92 410 53 M-20 155 C126 140 260 173 420 130 M-30 320 C130 296 238 337 430 288"/>
            </g>
            <g data-stage-layer="mountains" filter="url(#inkSoft)">
              <path class="mountain mountain-back" d="M-40 291 C24 244 49 174 98 165 C144 157 159 244 207 252 C253 260 281 181 328 176 C370 171 391 226 440 246 L440 345 L-40 345 Z"/>
              <path class="mountain mountain-front" d="M-35 324 C31 288 56 218 101 216 C148 214 170 294 219 298 C265 302 280 238 323 233 C368 227 391 287 435 303 L435 356 L-35 356 Z"/>
            </g>
            <g data-stage-layer="bridge">
              <path class="bridge-shadow" d="M31 299 C104 283 149 260 200 260 C251 260 296 283 369 299"/>
              <path class="bridge-deck" d="M28 282 C106 268 148 239 200 239 C252 239 294 268 372 282 L368 295 C296 280 251 258 200 258 C149 258 104 280 32 295 Z"/>
              <path class="bridge-arch" d="M66 293 C92 319 112 339 145 342 C160 293 177 276 200 276 C223 276 240 293 255 342 C288 339 308 319 334 293"/>
              <path class="bridge-rail" d="M57 278 L57 300 M92 269 L92 291 M129 253 L129 278 M166 242 L166 266 M200 238 L200 260 M234 242 L234 266 M271 253 L271 278 M308 269 L308 291 M343 278 L343 300"/>
            </g>
            <g data-stage-layer="water">
              <path class="wave wave-one" d="M-20 340 C34 315 72 363 127 338 C181 313 218 361 273 337 C328 313 366 358 420 332"/>
              <path class="wave wave-two" d="M-20 365 C38 342 77 383 132 361 C186 339 225 382 280 358 C334 335 373 377 420 356"/>
              <path class="wave wave-three" d="M-20 391 C31 371 79 405 128 384 C178 363 226 403 277 382 C328 361 372 397 420 377"/>
            </g>
          </svg>
        </div>

        <div class="audio-controls">
          <div class="pipeline-grid" role="radiogroup" aria-label="选择音频管线">
            <button class="pipeline-card is-selected" type="button" role="radio" aria-checked="true" data-pipeline-id="speaker">
              <span class="selection-rail" aria-hidden="true"></span><strong>扬声器</strong><small>系统音频 → 电脑扬声器</small>
            </button>
            <button class="pipeline-card" type="button" role="radio" aria-checked="false" data-pipeline-id="monitor">
              <span class="selection-rail" aria-hidden="true"></span><strong>混音监听</strong><small>系统音频 + 麦克风 → 扬声器</small>
            </button>
            <button class="pipeline-card" type="button" role="radio" aria-checked="false" data-pipeline-id="virtual-mic">
              <span class="selection-rail" aria-hidden="true"></span><strong>虚拟麦克风</strong><small>麦克风 → 电脑输入</small>
            </button>
            <button class="pipeline-card" type="button" role="radio" aria-checked="false" data-pipeline-id="shenanigans">
              <span class="selection-rail" aria-hidden="true"></span><strong>整活通道</strong><small>系统音频 → 电脑输入</small>
            </button>
          </div>
          <div class="stream-anchor">
            <button type="button" class="stream-button" id="streamButton" data-state="IDLE" aria-label="开始推流">
              <span class="progress-ring" aria-hidden="true"></span>
              <span class="stream-icon" aria-hidden="true"></span>
              <span class="stream-label">开始<br>推流</span>
            </button>
          </div>
        </div>
      </section>

      <section class="screen" data-screen="profile" aria-labelledby="profileTitle" hidden>
        <header class="top-app-bar"><h1 id="profileTitle">我的</h1></header>
        <div class="list-group" aria-label="关于墨堤">
          <button class="list-row" type="button"><span class="line-icon">◌</span><span>故事汇</span><span class="chevron">›</span></button>
          <button class="list-row" type="button"><span class="line-icon">♧</span><span>赞助榜</span><span class="chevron">›</span></button>
          <button class="list-row" type="button"><span class="line-icon">?</span><span>技术支持</span><span class="chevron">›</span></button>
        </div>
        <div class="list-group">
          <button class="list-row" type="button" data-navigate="settings"><span class="line-icon">⚙</span><span>设置</span><span class="chevron">›</span></button>
        </div>
      </section>

      <section class="screen" data-screen="settings" aria-labelledby="settingsTitle" hidden>
        <header class="top-app-bar settings-bar">
          <button class="icon-button" type="button" data-navigate="profile" aria-label="返回我的">‹</button>
          <h1 id="settingsTitle">设置</h1>
        </header>
        <div class="settings-scroll">
          <section class="settings-section"><h2>关于</h2><div class="settings-card">
            <button class="setting-row" id="versionRow" type="button"><span>版本号</span><small>1.0.0 (100)</small></button>
            <button class="setting-row" type="button"><span>开源协议</span><span class="chevron">›</span></button>
          </div></section>
          <section class="settings-section"><h2>调试</h2><div class="settings-card">
            <button class="setting-row" type="button"><span>日志导出</span><span class="chevron">›</span></button>
            <button class="setting-row" type="button"><span>网络诊断</span><span class="chevron">›</span></button>
          </div></section>
          <section class="settings-section"><h2>检查更新</h2><div class="settings-card">
            <div class="setting-row"><span><b>当前版本</b><small>已是最新版本</small></span><button class="tonal-button" type="button">检查</button></div>
          </div></section>
          <section class="settings-section danger-section"><h2>数据</h2><div class="settings-card">
            <button class="setting-row danger-row" type="button" data-danger-action="清除配对记录">清除配对记录</button>
            <button class="setting-row danger-row" type="button" data-danger-action="重置配置">重置配置</button>
          </div></section>
          <section class="settings-section developer-section" id="developerGroup" hidden><h2>开发者选项</h2><div class="settings-card">
            <button class="setting-row" type="button" data-audio-setting="音频参数"><span>音频参数</span><small>48 kHz · 128 kbps</small></button>
            <button class="setting-row" type="button" id="forceDisconnect"><span>强制断连</span><span class="chevron">›</span></button>
            <button class="setting-row" type="button"><span>日志级别</span><small>信息</small></button>
          </div></section>
        </div>
      </section>
    </div>

    <nav class="bottom-nav" id="bottomNav" aria-label="主导航">
      <button type="button" class="nav-item is-selected" data-navigate="audio" aria-current="page"><span class="nav-icon nav-audio" aria-hidden="true"></span><span>音频</span></button>
      <button type="button" class="nav-item" data-navigate="profile"><span class="nav-icon nav-profile" aria-hidden="true"></span><span>我的</span></button>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <dialog id="confirmDialog" class="app-dialog" aria-labelledby="confirmTitle">
      <form method="dialog"><h2 id="confirmTitle">确认操作</h2><p id="confirmMessage"></p><div class="dialog-actions"><button value="cancel" class="text-button">取消</button><button value="confirm" class="text-button danger-text" id="confirmAction">确认</button></div></form>
    </dialog>
    <dialog id="audioSettingDialog" class="app-dialog" aria-labelledby="audioSettingTitle">
      <form method="dialog"><h2 id="audioSettingTitle">停止推流并修改？</h2><p>音频参数需要停止当前推流后才能生效。应用参数后，请手动重新连接。</p><div class="dialog-actions"><button value="cancel" class="text-button">取消</button><button value="confirm" class="text-button" id="applyAudioSettingAction">停止并应用</button></div></form>
    </dialog>
  </main>
  <script src="app.js"></script>
</body>
</html>
