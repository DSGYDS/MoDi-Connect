<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><title>QrCard</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#F9FAFB; padding:40px; font-family:'Inter',sans-serif; display:flex; gap:20px; }
.card { background:#fff; border-radius:16px; padding:20px; box-shadow:0 4px 20px rgba(0,0,0,0.06); width:240px; }
.card-title { font-size:13px; color:#6B7280; margin-bottom:12px; font-weight:500; }
.qr-box { width:140px; height:140px; background:#1F2937; border-radius:12px; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; }
.qr-placeholder { color:#fff; font-size:24px; font-weight:600; letter-spacing:3px; opacity:0.6; }
.qr-hint { font-size:13px; color:#6B7280; text-align:center; margin-bottom:14px; }
.btn-refresh { display:flex; align-items:center; justify-content:center; gap:6px; width:100%; height:40px; border:none; border-radius:10px; background:#00C389; color:#fff; font-size:14px; font-weight:500; cursor:pointer; transition:all 0.15s; }
.btn-refresh:hover { background:#00b07c; transform:translateY(-1px); }
.btn-refresh:active { transform:scale(0.97); }
</style>
</head>
<body>
<div class="card">
  <div class="card-title">扫码连接</div>
  <div class="qr-box"><span class="qr-placeholder">⬛⬛</span></div>
  <div class="qr-hint">打开手机 App 扫码连接</div>
  <button class="btn-refresh"><i class="fas fa-qrcode"></i> 刷新二维码</button>
</div>
<div class="card">
  <div class="card-title">手动连接</div>
  <div class="qr-hint" style="text-align:left;margin-top:8px;margin-bottom:4px">电脑 IP</div>
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
    <span style="font-size:18px;font-weight:600;color:#111827;font-family:monospace">192.168.31.90</span>
    <i class="fas fa-copy" style="color:#6B7280;cursor:pointer;font-size:14px"></i>
  </div>
  <div style="font-size:12px;color:#6B7280;margin-top:8px">手机端输入此 IP 直连</div>
</div>
</body>
</html>
