<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><title>AudioStats</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#F9FAFB; padding:40px; font-family:'Inter',sans-serif; }
.card { background:#fff; border-radius:16px; padding:20px; box-shadow:0 4px 20px rgba(0,0,0,0.06); }
.card-title { font-size:13px; color:#6B7280; margin-bottom:12px; font-weight:500; }
.stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; }
.stat-item { display:flex; justify-content:space-between; border-bottom:1px solid #F3F4F6; padding-bottom:6px; }
.stat-item:last-child, .stat-item:nth-last-child(2) { border-bottom:none; }
.stat-label { font-size:13px; color:#6B7280; }
.stat-value { font-size:14px; font-weight:500; color:#111827; }
</style>
</head>
<body>
<div class="card" style="width:360px">
  <div class="card-title">音频统计</div>
  <div class="stats-grid">
    <div class="stat-item"><span class="stat-label"><i class="fas fa-microchip"></i> 采样率</span><span class="stat-value">48 kHz</span></div>
    <div class="stat-item"><span class="stat-label"><i class="fas fa-tachometer-alt"></i> 码率</span><span class="stat-value">128 kbps</span></div>
    <div class="stat-item"><span class="stat-label"><i class="fas fa-clock"></i> 延迟</span><span class="stat-value">12 ms</span></div>
    <div class="stat-item"><span class="stat-label"><i class="fas fa-exclamation-triangle"></i> 丢包</span><span class="stat-value">0.3 %</span></div>
    <div class="stat-item" style="grid-column:span 2"><span class="stat-label"><i class="fas fa-server"></i> 运行时长</span><span class="stat-value">01:23:45</span></div>
  </div>
</div>
</body>
</html>
