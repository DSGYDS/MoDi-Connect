<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><title>AudioMeter</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background:#F9FAFB; padding:40px; font-family:'Inter',sans-serif; }
.card { background:#fff; border-radius:16px; padding:20px; box-shadow:0 4px 20px rgba(0,0,0,0.06); }
.card-title { font-size:13px; color:#6B7280; margin-bottom:16px; font-weight:500; }
.meter-row { margin-bottom:14px; }
.meter-label { display:flex; justify-content:space-between; font-size:12px; color:#6B7280; margin-bottom:4px; }
.meter-track { width:100%; height:10px; border-radius:5px; background:#E5E7EB; overflow:hidden; display:flex; gap:2px; padding:0 1px; }
.meter-fill { height:100%; border-radius:3px; background:#22C55E; transition:width 0.2s; }
.meter-fill.warning { background:#F59E0B; }
.meter-fill.danger { background:#EF4444; }
.waveform { margin-top:16px; height:50px; display:flex; align-items:flex-end; gap:3px; }
.wave-bar { flex:1; background:#00C389; border-radius:3px 3px 0 0; animation:wave 1.2s ease-in-out infinite alternate; }
.wave-bar:nth-child(1) { height:20%; animation-delay:0s; }
.wave-bar:nth-child(2) { height:45%; animation-delay:0.1s; }
.wave-bar:nth-child(3) { height:70%; animation-delay:0.2s; }
.wave-bar:nth-child(4) { height:90%; animation-delay:0.3s; }
.wave-bar:nth-child(5) { height:60%; animation-delay:0.15s; }
.wave-bar:nth-child(6) { height:30%; animation-delay:0.05s; }
.wave-bar:nth-child(7) { height:80%; animation-delay:0.25s; }
.wave-bar:nth-child(8) { height:50%; animation-delay:0.2s; }
.wave-bar:nth-child(9) { height:95%; animation-delay:0.35s; }
.wave-bar:nth-child(10) { height:40%; animation-delay:0.1s; }
@keyframes wave { 0% { transform:scaleY(0.6); } 100% { transform:scaleY(1); } }
</style>
</head>
<body>
<div class="card" style="width:360px">
  <div class="card-title">音频电平</div>
  <div class="meter-row">
    <div class="meter-label"><span>接收</span><span>—18 dB</span></div>
    <div class="meter-track">
      <div class="meter-fill" style="width:30%"></div>
      <div class="meter-fill" style="width:20%"></div>
      <div class="meter-fill warning" style="width:8%"></div>
      <div class="meter-fill danger" style="width:3%"></div>
    </div>
  </div>
  <div class="meter-row">
    <div class="meter-label"><span>发送</span><span>—12 dB</span></div>
    <div class="meter-track">
      <div class="meter-fill" style="width:40%"></div>
      <div class="meter-fill" style="width:25%"></div>
      <div class="meter-fill warning" style="width:10%"></div>
    </div>
  </div>
  <div class="card-title" style="margin-top:16px">实时波形</div>
  <div class="waveform">
    <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
  </div>
</div>
</body>
</html>
